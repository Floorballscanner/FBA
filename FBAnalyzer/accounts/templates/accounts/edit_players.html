<!--

This is the Edit Players - page where users can add, delete, and edit
 player data -->

{% extends 'app_layout.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/landing.css' %}">
{% endblock %}

{% block content %}
{{ request.user.id|json_script:"user_id" }}

<div class="landing" style="--landing-bg: #ffffff;">

    <div class="landing-page-header">
        <a href="/accounts/edit_data" aria-label="Back" style="display:inline-block;margin-bottom:12px;">
            <img src="{% static 'back.png' %}" width="20" alt="">
        </a>
        <h1>Edit Players</h1>
        <p>Please make sure that your connection is secure (URL starts with http(s):).</p>
    </div>

    <div class="landing-edit-layout">
        <div class="landing-edit-selectors">
            <div class="landing-select-group">
                <label for="select-player-level">Level</label>
                <select onchange="selectPlayerLevel()" id="select-player-level">
                    <option selected disabled>Select a level...</option>
                    {% for level in levels %}
                        <option value="{{level.id}}">{{level.name}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="landing-select-group">
                <label for="select-team">Team</label>
                <select onchange="selectTeam()" id="select-team" disabled>
                    <option selected disabled>Select a team..</option>
                </select>
            </div>
            <div class="landing-select-group">
                <label for="edit-player">Player</label>
                <select onchange="editPlayer()" id="edit-player" disabled>
                    <option selected disabled>Select a player..</option>
                    <option value="new_player">Add new player...</option>
                </select>
            </div>
            <img src="{% static 'symbol_transparent.png' %}" alt="">
        </div>

        <div class="landing-form-card" style="text-align:left;">
            <form>
                <label for="edit_player_firstname">First Name</label>
                <input type="text" id="edit_player_firstname" name="edit_player_firstname" disabled>

                <label for="edit_player_lastname">Last Name</label>
                <input type="text" id="edit_player_lastname" name="edit_player_lastname" disabled>

                <label for="edit_player_number">Jersey Number</label>
                <input type="text" id="edit_player_number" name="edit_player_number" disabled>

                <label for="edit_player_id">ID</label>
                <input type="text" id="edit_player_id" name="edit_player_id" disabled>

                <label for="edit_player_level">Team</label>
                <select onchange="changePlayerLevel()" id="edit_player_level" name="edit_player_level" disabled>
                    <option selected disabled>Select a level...</option>
                </select>
                <select id="edit_player_team" name="edit_player_team" disabled>
                    <option selected disabled>Select a team...</option>
                </select>

                <input type="button" id="edit_player_button" onclick="editPlayerButton()" value="Save" disabled>
                <img src="{% static 'delete.png' %}" class="landing-delete-icon" id="edit_player_delete" onclick="deletePlayerButton()" disabled alt="Delete">
            </form>
        </div>
    </div>

</div>

<script type="text/javascript" src="/static/js/editvariables.js"></script>
<script type="text/javascript" src="/static/js/editfunctions.js"></script>

{% endblock %}
