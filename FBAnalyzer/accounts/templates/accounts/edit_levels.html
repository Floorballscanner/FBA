<!-- This is the Edit Series - page where users can add, delete, and edit
 series data -->

{% extends 'app_layout.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/landing.css' %}">
{% endblock %}

{% block content %}
{{ request.user.id|json_script:"user_id" }}

<div class="landing" style="--landing-bg: #ffffff;">

    <div class="landing-page-header">
        <a href="/accounts/edit_data" aria-label="Back" style="display:inline-block;margin-bottom:12px;">
            <img src="{% static 'back.png' %}" width="20" alt="">
        </a>
        <h1>Edit Levels</h1>
    </div>

    <div class="landing-edit-layout">
        <div class="landing-edit-selectors">
            <div class="landing-select-group">
                <label for="edit-level">Level</label>
                <select onchange="editLevel()" id="edit-level">
                    <option selected disabled>Select a level...</option>
                    <option value="new_level">Add new level...</option>
                    {% for level in levels %}
                        <option value="{{level.id}}">{{level.name}}</option>
                    {% endfor %}
                </select>
            </div>
            <img src="{% static 'symbol_transparent.png' %}" alt="">
        </div>

        <div class="landing-form-card" style="text-align:left;">
            <form>
                <label for="edit_level_name">Level Name</label>
                <input type="text" id="edit_level_name" name="edit_level_name" disabled>

                <label for="edit_level_id">ID</label>
                <input type="text" id="edit_level_id" name="edit_level_id" disabled>

                <label for="edit_level_country">Country</label>
                <select id="edit_level_country" name="edit_level_country" disabled>
                    <option selected disabled>Select a country...</option>
                </select>

                <div class="landing-checkbox-row">
                    <input type="checkbox" id="edit_level_isSenior" name="edit_level_isSenior" disabled>
                    <label for="edit_level_isSenior">Senior (Adult) Level?</label>
                </div>
                <div class="landing-checkbox-row">
                    <input type="checkbox" id="edit_level_isMale" name="edit_level_isMale" disabled>
                    <label for="edit_level_isMale">Men's Level?</label>
                </div>
                <div class="landing-checkbox-row">
                    <input type="checkbox" id="edit_level_isNational" name="edit_level_isNational" disabled>
                    <label for="edit_level_isNational">National Team Level?</label>
                </div>

                <input type="button" id="edit_level_button" onclick="editLevelButton()" value="Save" disabled>
                <img src="{% static 'delete.png' %}" class="landing-delete-icon" id="edit_level_delete" onclick="deleteLevelButton()" alt="Delete">
            </form>
        </div>
    </div>

</div>

<script type="text/javascript" src="/static/js/editvariables.js"></script>
<script type="text/javascript" src="/static/js/editfunctions.js"></script>

{% endblock %}
