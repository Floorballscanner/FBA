<!--

This is the Login - html - page content file. It is shown when the user clicks the Login - button.
It extends base_layout.html with Django, and utilizes Django's existing login - functionalities.

-->

{% extends 'base_layout.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/landing.css' %}">
{% endblock %}

{% block content %}
<div class="landing">
    <div class="landing-narrow">
        <div class="landing-form-card">
            <h1>Login to Floorball Scanner</h1>
            <p>Log in with your username and password.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <input type="submit" value="Login">
            </form>
            <p style="margin:16px 0 0;font-size:14px;">
                <a href="{% url 'password_reset' %}">Forgot your password?</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
