<!--

This is the F-Liiga statistics page. Team/player/goalie tables are computed
ahead of time by the compute_fliiga_stats management command and cached in
FliigaSeasonStats — this page just fetches the cached table for whatever
league/season/stage/table combination is selected, instead of the old
in-browser computation that needed hundreds of API calls per page load.

-->

{% extends 'app_layout.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/landing.css' %}">
{% endblock %}

{% block content %}
<div class="landing" style="--landing-bg: #ffffff;">

    <div class="landing-page-header">
        <a href="/accounts/fliiga" aria-label="Back" style="display:inline-block;margin-bottom:12px;">
            <img src="{% static 'back.png' %}" width="20" alt="">
        </a>
        <h1>F-Liiga statistics</h1>
        <p>Choose a league, season, and stage, then pick which table to view.</p>
    </div>

    <div class="landing-match-selector">
        <div class="landing-select-group">
            <label for="select-league">League</label>
            <select id="select-league" onchange="maybeLoadStats()">
                <option value="" selected disabled>Select...</option>
                <option value="men">Men</option>
                <option value="women">Women</option>
            </select>
        </div>
        <div class="landing-select-group">
            <label for="select-season">Season</label>
            <select id="select-season" onchange="maybeLoadStats()">
                <option value="2026-2027">2026-2027</option>
                <option value="2025-2026" selected>2025-2026</option>
                <option value="2024-2025">2024-2025</option>
            </select>
        </div>
        <div class="landing-select-group">
            <label for="select-stage">Stage</label>
            <select id="select-stage" onchange="maybeLoadStats()">
                <option value="regular" selected>Regular season</option>
                <option value="playoffs">Playoffs</option>
            </select>
        </div>
        <div class="landing-select-group">
            <label for="select-table">Table</label>
            <select id="select-table" onchange="maybeLoadStats()">
                <option value="teams" selected>Teams</option>
                <option value="players">Players</option>
                <option value="goalies">Goalies</option>
            </select>
        </div>
    </div>

    <p id="pending-message" style="display:none;text-align:center;color:var(--landing-muted);padding-bottom:24px;">
        Statistics are being prepared for this selection — check back soon.
    </p>

    <p id="stats-meta" style="display:none;text-align:center;color:var(--landing-muted);font-size:13px;padding-bottom:12px;"></p>

    <p id="stats-legend" class="landing-result__legend" style="display:none;max-width:900px;margin-left:auto;margin-right:auto;padding:0 24px;"></p>

    <div class="landing-result landing-result--wide">
        <div class="landing-result__card landing-result__card--flush" id="stats_table"></div>
    </div>

</div>

<script type="text/javascript" src="/static/js/fliigastatspage.js"></script>
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script type="text/javascript">
    google.charts.load('current', {'packages':['table']});
</script>

{% endblock %}
