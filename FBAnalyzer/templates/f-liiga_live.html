<!--

This is the F-Liiga "Today's Matches" page — lists today's F-Liiga games (men and
women, regular season and playoffs) as a compact single-row-per-game list, kept
deliberately simple for scanning many games at once on mobile. Row markup is
built by fliigalivepage.js; this template just provides the shell.

-->

{% extends 'app_layout.html' %}
{% block title %}F-Liiga Live | Floorball Scanner{% endblock %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/landing.css' %}">
{% endblock %}

{% block content %}
<div class="landing">

    <div class="landing-page-header">
        <a href="/accounts/fliiga" aria-label="Back" style="display:inline-block;margin-bottom:12px;">
            <img src="{% static 'back.png' %}" width="20" alt="">
        </a>
        <h1>F-Liiga matches</h1>
        <p>Live and finished games for today, or pick an upcoming day below.</p>
    </div>

    <div id="dateCarousel" class="date-carousel" style="display:none;"></div>

    <p id="empty-state" style="display:none;text-align:center;color:var(--landing-muted);">
        No F-Liiga matches today.
    </p>

    <div id="head" class="landing-match-list"></div>

</div>

<script type="text/javascript" src="{% static 'js/fliigalivepage.js' %}"></script>

{% endblock %}
