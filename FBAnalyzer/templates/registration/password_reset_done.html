<!--

Shown right after submitting the password reset request. Uses Django's
built-in PasswordResetDoneView.

-->

{% extends 'base_layout.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/landing.css' %}">
{% endblock %}

{% block content %}
<div class="landing">
    <div class="landing-narrow">
        <div class="landing-form-card">
            <h1>Check your email</h1>
            <p>
                If an account exists with the email address you entered, we've sent
                a link to reset your password. It may take a few minutes to arrive.
            </p>
        </div>
    </div>
</div>
{% endblock %}
