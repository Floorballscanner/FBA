<!--

Password reset request page — where the user enters their email to receive a
reset link. Uses Django's built-in PasswordResetView.

-->

{% extends 'base_layout.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/landing.css' %}">
{% endblock %}

{% block content %}
<div class="landing">
    <div class="landing-narrow">
        <div class="landing-form-card">
            <h1>Reset your password</h1>
            <p>Enter your account's email address and we'll send you a link to reset your password.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <input type="submit" value="Send reset link">
            </form>
        </div>
    </div>
</div>
{% endblock %}
