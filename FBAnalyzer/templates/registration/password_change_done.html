<!--

Shown after a successful password change. Uses Django's built-in PasswordChangeDoneView.

-->

{% extends 'base_layout.html' %}
{% block title %}Password Changed | Floorball Scanner{% endblock %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/landing.css' %}">
{% endblock %}

{% block content %}
<div class="landing">
    <div class="landing-narrow">
        <div class="landing-form-card">
            <h1>Password changed</h1>
            <p>Your password has been changed successfully.</p>
            <a class="landing-btn landing-btn--primary" href="/accounts" role="button">Continue</a>
        </div>
    </div>
</div>
{% endblock %}
