<!--

Shown after a successful password reset. Uses Django's built-in
PasswordResetCompleteView.

-->

{% extends 'base_layout.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/landing.css' %}">
{% endblock %}

{% block content %}
<div class="landing">
    <div class="landing-narrow">
        <div class="landing-form-card">
            <h1>Password reset</h1>
            <p>Your password has been set. You can now log in with your new password.</p>
            <a class="landing-btn landing-btn--primary" href="{% url 'login' %}" role="button">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
